spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/urlshortener}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:urlshortener}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:urlshortener}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false
app.cache.enabled=false
app.cache.url-ttl=24h
app.shortener.code-length=7
app.shortener.default-expiration-days=30
