spring.application.name=url-shortener

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:urlshortener}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:urlshortener}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

app.shortener.code-length=7
app.shortener.default-expiration-days=30
app.cache.enabled=${APP_CACHE_ENABLED:true}
app.cache.url-ttl=24h
